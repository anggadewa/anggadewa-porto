<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Fleet Management Operational Flowchart</title>
  <desc id="desc">Flowchart showing the Fleet Management workflow from BASIS UB UJ setup, dispatch trip, departure and unloading weighing, reconciliation, shrinkage, REKAP BOR period review, TG adjustment, payroll THP, NKB export, and audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="1180" rx="56" fill="url(#bg)"/>

  <g transform="translate(100 84)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" fill="#111827" font-size="52" font-weight="900" letter-spacing="0">Fleet Management</text>
    <text x="0" y="42" fill="#64748b" font-size="20" font-weight="700" letter-spacing="2">EXCEL-DRIVEN FLEET, WEIGHBRIDGE, PAYROLL, AND NKB FLOW</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="105" y="190" width="270" height="116" rx="28" fill="#ffffff" stroke="#bae6fd"/>
      <text x="240" y="238" fill="#111827">BASIS UB/UJ</text>
      <text x="240" y="270" fill="#64748b" font-size="15" font-weight="700">rate, route, truck type</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="485" y="190" width="270" height="116" rx="28" fill="#ffffff" stroke="#bae6fd"/>
      <text x="620" y="238" fill="#111827">Dispatch Trip</text>
      <text x="620" y="270" fill="#64748b" font-size="15" font-weight="700">driver, truck, load plan</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="865" y="190" width="270" height="116" rx="28" fill="#ffffff" stroke="#bae6fd"/>
      <text x="1000" y="238" fill="#111827">Timbang</text>
      <text x="1000" y="270" fill="#64748b" font-size="15" font-weight="700">depart and unload</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1245" y="190" width="250" height="116" rx="28" fill="#ffffff" stroke="#bae6fd"/>
      <text x="1370" y="238" fill="#111827">Rekonsiliasi</text>
      <text x="1370" y="270" fill="#64748b" font-size="15" font-weight="700">netto and status</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="250" y="420" width="1100" height="132" rx="32" fill="url(#primary)"/>
      <text x="800" y="470" fill="#ffffff">Operational Calculation Core</text>
      <text x="800" y="508" fill="#cffafe" font-size="16" font-weight="700">netto = gross - tare, honor = netto x UB - uang jalan, susut tolerance by product</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="105" y="675" width="305" height="132" rx="30" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="258" y="722" fill="#111827">Susut Produk</text>
      <text x="258" y="754" fill="#64748b" font-size="15" font-weight="700">arrival minus departure</text>
      <text x="258" y="782" fill="#64748b" font-size="15" font-weight="700">0.3% or CKG 0.5%</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="465" y="675" width="305" height="132" rx="30" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="618" y="722" fill="#111827">REKAP BOR P1/P2</text>
      <text x="618" y="754" fill="#64748b" font-size="15" font-weight="700">eligible reconciled trips</text>
      <text x="618" y="782" fill="#64748b" font-size="15" font-weight="700">period review target</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="830" y="675" width="305" height="132" rx="30" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="983" y="722" fill="#111827">TG &amp; Adjustment</text>
      <text x="983" y="754" fill="#64748b" font-size="15" font-weight="700">manual additions</text>
      <text x="983" y="782" fill="#64748b" font-size="15" font-weight="700">deductions and approval</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1190" y="675" width="305" height="132" rx="30" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1343" y="722" fill="#111827">Gaji / THP</text>
      <text x="1343" y="754" fill="#64748b" font-size="15" font-weight="700">borongan, BPJS, JHT</text>
      <text x="1343" y="782" fill="#64748b" font-size="15" font-weight="700">rounded payroll result</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="325" y="920" width="390" height="116" rx="28" fill="#ffffff" stroke="#a5f3fc"/>
      <text x="520" y="968" fill="#111827">NKB Export</text>
      <text x="520" y="1000" fill="#64748b" font-size="15" font-weight="700">accounting handoff</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="885" y="920" width="390" height="116" rx="28" fill="#ffffff" stroke="#a5f3fc"/>
      <text x="1080" y="968" fill="#111827">Audit Trail</text>
      <text x="1080" y="1000" fill="#64748b" font-size="15" font-weight="700">state changes and actions</text>
    </g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M375 248 H485"/>
    <path d="M755 248 H865"/>
    <path d="M1135 248 H1245"/>
    <path d="M1370 306 V360 C1370 400 1280 420 1190 420"/>
    <path d="M800 552 V610 C800 645 618 645 618 675"/>
    <path d="M615 552 C460 590 258 625 258 675"/>
    <path d="M910 552 C960 600 983 628 983 675"/>
    <path d="M1050 552 C1220 600 1343 628 1343 675"/>
    <path d="M410 741 H465"/>
    <path d="M770 741 H830"/>
    <path d="M1135 741 H1190"/>
    <path d="M650 807 C640 865 585 885 520 920"/>
    <path d="M1343 807 C1320 875 1235 900 1080 920"/>
    <path d="M715 978 H885"/>
  </g>

  <g transform="translate(100 1080)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="1400" height="1" fill="#e2e8f0"/>
    <text x="0" y="42" fill="#64748b" font-size="16" font-weight="700">Validation note: this case is positioned as an operational prototype. Full payroll parity still depends on period-level REKAP BOR, TG recap, susut correction, and production master-data validation.</text>
  </g>
</svg>
